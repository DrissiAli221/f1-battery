services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: f1battery
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - f1battery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1battery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  f1battery_pgdata:
