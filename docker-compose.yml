services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_DB: f1battery
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1dev}
      # No usage reports to Timescale.
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - f1battery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1battery"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional live-replay broker (Phase 7, docs/phase7-replay.md). Not started by a plain
  # `docker compose up`; enable with `docker compose --profile replay up -d`.
  # Single-node KRaft (broker + controller in one process): no ZooKeeper, no schema registry.
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["replay"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Replay data is disposable: keep the log small.
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - f1battery_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Application images (docs/ops.md). Not started by a plain `docker compose up`:
  #   docker compose --profile app up -d --build api
  # The ingest job is run once: docker compose --profile app run --rm ingest --source=local
  api:
    profiles: ["app"]
    build: {context: ., dockerfile: api/Dockerfile}
    depends_on: {db: {condition: service_healthy}}
    environment:
      DB_URL: jdbc:postgresql://db:5432/f1battery
      DB_USER: f1_api
      DB_PASSWORD: ${API_DB_PASSWORD:-f1api}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"

  ingest:
    profiles: ["app"]
    build: {context: ., dockerfile: ingest/Dockerfile}
    depends_on: {db: {condition: service_healthy}}
    environment:
      DB_URL: jdbc:postgresql://db:5432/f1battery
      DB_USER: f1
      DB_PASSWORD: ${POSTGRES_PASSWORD:-f1dev}
      # Becomes the password of the read-only f1_api role (migration V7).
      API_DB_PASSWORD: ${API_DB_PASSWORD:-f1api}
      INGEST_LOCAL_ROOT: /data/raw/openf1
    volumes:
      - ./data/raw/openf1:/data/raw/openf1:ro

volumes:
  f1battery_pgdata:
  f1battery_kafka:
