<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 525" width="1280" height="525" role="img" aria-labelledby="t d">
  <title id="t">What one estimate is</title><desc id="d">Illustrative speed trace along one straight: speed rises through the deploy regime, flattens at a plateau, and a red cut-off marker sits where acceleration stays low, with a 95 percent lap-to-lap interval bar below.</desc>
  <defs>
    <radialGradient id="ground" cx="0.72" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#fbfbf8"/><stop offset="1" stop-color="#f4f4ef"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#e10600" stop-opacity="0.077"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.064"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.2 L8.8 5 L1 8.8 Z" fill="#6b6b66"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.2 L8.8 5 L1 8.8 Z" fill="#e10600"/>
    </marker>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.15" fill="#090909" fill-opacity="0.32"/></pattern>
  </defs>
  <rect width="1280" height="525" rx="20" fill="url(#ground)"/>
  <rect x="0.5" y="0.5" width="1279" height="524" rx="19.5" fill="none" stroke="rgba(0,0,0,0.10)"/>
  <text x="28" y="40" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >WHAT ONE ESTIMATE IS · ONE STRAIGHT, ONE CAR, ONE LAP</text><text x="1252" y="40" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#e10600" >ILLUSTRATIVE SHAPE, NOT DATA</text><path d="M0 62 H1280" stroke="rgba(0,0,0,0.10)"/><path d="M110 330 H1170" stroke="rgba(0,0,0,0.20)"/><path d="M110 110 V330" stroke="rgba(0,0,0,0.20)"/><text x="110" y="352" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >0</text><text x="1170" y="352" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >L M</text><text x="640" y="352" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >DISTANCE ALONG THE STRAIGHT</text><text x="96" y="120" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >SPEED</text><path d="M110 239.7 H1170" stroke="rgba(0,0,0,0.10)" stroke-dasharray="3 6"/><text x="1170" y="231.7" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#6b6b66" >250 KPH</text><path d="M110 330 L123.25 319.62 L136.5 309.76 L149.75 300.41 L163 291.54 L176.25 283.12 L189.5 275.14 L202.75 267.56 L216 260.37 L229.25 253.54 L242.5 247.07 L255.75 240.92 L269 235.1 L282.25 229.56 L295.5 224.32 L308.75 219.34 L322 214.61 L335.25 210.13 L348.5 205.87 L361.75 201.84 L375 198.01 L388.25 194.37 L401.5 190.93 L414.75 187.65 L428 184.55 L441.25 181.6 L454.5 178.81 L467.75 176.16 L481 173.64 L494.25 171.25 L507.5 168.99 L520.75 166.84 L534 164.8 L547.25 162.86 L560.5 161.03 L573.75 159.28 L587 157.63 L600.25 156.06 L613.5 154.57 L626.75 153.16 L640 151.82 L653.25 150.55 L666.5 149.34 L679.75 148.2 L693 147.11 L706.25 146.08 L719.5 145.1 L724.8 330 L110 330 Z" fill="url(#dots)"/><path d="M110 330 L123.25 319.62 L136.5 309.76 L149.75 300.41 L163 291.54 L176.25 283.12 L189.5 275.14 L202.75 267.56 L216 260.37 L229.25 253.54 L242.5 247.07 L255.75 240.92 L269 235.1 L282.25 229.56 L295.5 224.32 L308.75 219.34 L322 214.61 L335.25 210.13 L348.5 205.87 L361.75 201.84 L375 198.01 L388.25 194.37 L401.5 190.93 L414.75 187.65 L428 184.55 L441.25 181.6 L454.5 178.81 L467.75 176.16 L481 173.64 L494.25 171.25 L507.5 168.99 L520.75 166.84 L534 164.8 L547.25 162.86 L560.5 161.03 L573.75 159.28 L587 157.63 L600.25 156.06 L613.5 154.57 L626.75 153.16 L640 151.82 L653.25 150.55 L666.5 149.34 L679.75 148.2 L693 147.11 L706.25 146.08 L719.5 145.1 L724.8 330 L110 330 Z" fill="#090909" fill-opacity="0.06"/><path d="M110 330 L123.25 319.62 L136.5 309.76 L149.75 300.41 L163 291.54 L176.25 283.12 L189.5 275.14 L202.75 267.56 L216 260.37 L229.25 253.54 L242.5 247.07 L255.75 240.92 L269 235.1 L282.25 229.56 L295.5 224.32 L308.75 219.34 L322 214.61 L335.25 210.13 L348.5 205.87 L361.75 201.84 L375 198.01 L388.25 194.37 L401.5 190.93 L414.75 187.65 L428 184.55 L441.25 181.6 L454.5 178.81 L467.75 176.16 L481 173.64 L494.25 171.25 L507.5 168.99 L520.75 166.84 L534 164.8 L547.25 162.86 L560.5 161.03 L573.75 159.28 L587 157.63 L600.25 156.06 L613.5 154.57 L626.75 153.16 L640 151.82 L653.25 150.55 L666.5 149.34 L679.75 148.2 L693 147.11 L706.25 146.08 L719.5 145.1 L732.75 144.17 L746 143.29 L759.25 142.46 L772.5 141.66 L785.75 140.91 L799 140.2 L812.25 139.52 L825.5 138.88 L838.75 138.27 L852 137.69 L865.25 137.14 L878.5 136.62 L891.75 136.13 L905 135.66 L918.25 135.21 L931.5 134.79 L944.75 134.39 L958 134.01 L971.25 133.65 L984.5 133.31 L997.75 132.98 L1011 132.67 L1024.25 132.38 L1037.5 132.1 L1050.75 131.84 L1064 131.59 L1077.25 131.35 L1090.5 131.13 L1103.75 130.91 L1117 130.71 L1130.25 130.52 L1143.5 130.34 L1156.75 130.16 L1170 130" fill="none" stroke="#090909" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="304" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#090909" >DEPLOY REGIME</text><text x="170" y="320" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#6b6b66" >SPEED STILL RISING</text><text x="947.4" y="304" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#090909" >PLATEAU</text><path d="M724.8 100 V334" stroke="#e10600" stroke-width="2" stroke-dasharray="6 5"/><circle cx="724.8" cy="144.72" r="6" fill="#f4f4ef" stroke="#e10600" stroke-width="2.5"/><text x="724.8" y="88" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#e10600" >CUT-OFF, M INTO STRAIGHT</text><text x="740.8" y="180.72" font-family="Geist, Archivo, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b66">first point above 250 kph where</text>
        <text x="740.8" y="198.72" font-family="Geist, Archivo, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b66">acceleration stays below 0.5 m/s² for four 0.25 s steps</text><path d="M110 446 H1170" stroke="rgba(0,0,0,0.20)"/><path d="M724.8 334 V420" stroke="#e10600" stroke-opacity="0.35" stroke-dasharray="2 5"/><circle cx="686.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="702.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="709.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="716.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="721.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="726.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="731.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="736.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="745.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="757.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><circle cx="770.8" cy="420" r="3.4" fill="#090909" fill-opacity="0.75"/><path d="M678.8 434 H778.8" stroke="#e10600" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M678.8 426 V442 M778.8 426 V442" stroke="#e10600" stroke-width="2"/><text x="96" y="424" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >LAPS</text><text x="96" y="438" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#6b6b66" >INTERVAL</text><text x="796.8" y="438" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#e10600" >95% BOOTSTRAP INTERVAL, LAP-TO-LAP</text><text x="28" y="505" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#6b6b66" >AN ESTIMATE UNDER STATED ASSUMPTIONS (MASS, DRAG AREA, DERATE RATE). NEVER A MEASUREMENT OF BATTERY STATE.</text>
</svg>
