<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 545" width="1280" height="545" role="img" aria-labelledby="t d">
  <title id="t">Pipeline</title><desc id="d">OpenF1 flows into a Java ingest job, PostgreSQL with TimescaleDB, a Python estimator, a versioned model run, a read-only Spring Boot API and a React web app. An optional Kafka replay lane streams regime state to the API over server-sent events.</desc>
