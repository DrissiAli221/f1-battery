server:
  # Honour X-Forwarded-Proto/Host from a reverse proxy. The client address for rate limiting is
  # resolved separately (api.trusted-proxies); with none configured the socket peer is used.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/f1battery}
    username: ${DB_USER:f1_api}
    password: ${DB_PASSWORD:f1api}
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: always

api:
  cors-origin: ${API_CORS_ORIGIN:http://localhost:5173}
  rate-per-min: ${API_RATE_PER_MIN:60}
  # Comma-separated addresses or CIDR ranges of reverse proxies whose X-Forwarded-For is believed.
  trusted-proxies: ${API_TRUSTED_PROXIES:}
  live:
    max-streams: ${API_LIVE_MAX_STREAMS:20}
  outline:
    # Stored location units between kept outline points (OpenF1 x/y are 1/10 m, so 500 = 50 m).
    spacing-units: 500
  replay:
    # Opt-in live replay (Phase 7): streams regime-state.<session_key> from Kafka over SSE.
    enabled: ${API_REPLAY_ENABLED:false}
    kafka-bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
    # Replay slots the VM controller keeps running at once (reported as capacity.max by /api/live).
    max-sessions: ${API_REPLAY_MAX_SESSIONS:3}
