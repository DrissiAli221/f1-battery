spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/f1battery}
    username: ${DB_USER:f1}
    password: ${DB_PASSWORD:f1dev}
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: always

api:
  cors-origin: ${API_CORS_ORIGIN:http://localhost:5173}
  rate-per-min: ${API_RATE_PER_MIN:60}
  outline:
    # Stored location units between kept outline points (OpenF1 x/y are 1/10 m, so 500 = 50 m).
    spacing-units: 500
  replay:
    # Opt-in live replay (Phase 7): streams regime-state.<session_key> from Kafka over SSE.
    enabled: ${API_REPLAY_ENABLED:false}
    kafka-bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
