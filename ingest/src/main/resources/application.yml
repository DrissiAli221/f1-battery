spring:
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/f1battery}
    username: ${DB_USER:f1}
    password: ${DB_PASSWORD:f1dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Password of the read-only f1_api role created by V7 (dev default; set API_DB_PASSWORD elsewhere).
      api_db_password: ${API_DB_PASSWORD:f1api}

ingest:
  run-on-startup: true
  local:
    root: ${INGEST_LOCAL_ROOT:data/raw/openf1}
  api:
    base-url: ${OPENF1_BASE_URL:https://api.openf1.org}
